# AI Tagger (experimental): two GPU containers the panel starts when it needs them.
#   tagger  WD EVA02-Large Tagger v3 + RAM++ image taggers (immich_organizer/tagger_service.py)
#   vlm     Qwen3.5-9B behind vLLM's OpenAI API; refines the tags and writes the description
# Both stop by themselves / are stopped by the panel, freeing the GPU (restart is "no" on purpose).
#   build once:  docker compose -p immich-aitagger -f deploy/aitagger/docker-compose.yml build tagger
#   (the vlm image is pulled: docker compose -p immich-aitagger -f deploy/aitagger/docker-compose.yml pull vlm)
# The model files (about 1.4 GB WD + 3 GB RAM++ + 18 GB Qwen3.5-9B on first use) live in AITAGGER_CACHE
# (set it in deploy/aitagger/.env, see .env.example). The Search+ container and this one never share the GPU:
# the panel stops Search+ before it starts the tagger.
name: immich-aitagger
services:
  tagger:
    build: .
    image: immich-aitagger:latest
    container_name: immich_aitagger
    restart: "no"
    mem_limit: 12g
    memswap_limit: 12g
    ports:
      - "127.0.0.1:11440:8080"
    volumes:
      - ${AITAGGER_CACHE:-~/vlm/models/aitagger}:/cache
      - ../../immich_organizer:/app:ro
    environment:
      AITAGGER_VRAM_GB: ${AITAGGER_VRAM_GB:-5}      # memory cap for the tagger process (WD + RAM++ together)
      AITAGGER_BATCH: ${AITAGGER_BATCH:-16}         # images per GPU micro-batch (WD is held to 8: it gains nothing more)
      IDLE_EXIT_MINUTES: ${IDLE_EXIT_MINUTES:-20}   # the server exits after this long without a request (never mid-request)
      WD_MODEL: SmilingWolf/wd-eva02-large-tagger-v3
      RAM_MODEL: xinyu1205/recognize-anything-plus-model
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      HF_HUB_DISABLE_TELEMETRY: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vlm:
    # vLLM 0.30.0 (2026-09-22, CUDA 13 build) is the current stable release and serves Qwen3.5 (hybrid
    # Gated-DeltaNet text model + vision tower) natively. Pinned so a pull never changes behaviour under you.
    image: vllm/vllm-openai:v0.30.0
    container_name: immich_aitagger_vlm
    restart: "no"
    ports:
      - "127.0.0.1:11441:8000"
    volumes:
      - ${AITAGGER_CACHE:-~/vlm/models/aitagger}/hf:/root/.cache/huggingface
      - ${AITAGGER_CACHE:-~/vlm/models/aitagger}/vllm:/root/.cache/vllm      # torch.compile cache: saves ~30 s per start
    # vLLM shares memory between its processes (and caches multimodal inputs in it); Docker's default 64 MB is
    # too small. "host" is what the vLLM docs recommend; it only shares the IPC namespace.
    ipc: host
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
    # The image's entrypoint is `vllm serve`, so the command starts with the model.
    #   --quantization fp8          linear layers are quantised to FP8 on load (Ada / RTX 4090 supports it). The weights
    #                               still take 10.8 GiB: embeddings, lm_head and the vision tower stay bf16.
    #   --gpu-memory-utilization    this container's share of the GPU's TOTAL memory. It must cover the weights (10.8 GiB),
    #                               ~1 GiB of activations and the KV cache: 0.51 is the bare minimum to start, 0.58 leaves
    #                               room for 8 concurrent requests with 6 pictures each (the real footprint is ~0.8 GiB
    #                               more than this, for the CUDA context). The old 0.45 cannot start this model.
    #   --max-num-seqs              concurrent requests; the panel's "parallel descriptions" setting
    #   --limit-mm-per-prompt       up to 8 pictures per request (video frames)
    #   --max-num-batched-tokens    8192 = max-model-len; the default (16384) doubles the activation memory
    #   --mm-processor-kwargs       pictures above 768x768 px are downscaled instead of costing >576 tokens each
    #   --default-chat-template-kwargs  thinking off even when a client forgets chat_template_kwargs.enable_thinking
    command:
      - Qwen/Qwen3.5-9B
      - --served-model-name
      - tagger-vlm
      - --quantization
      - fp8
      - --gpu-memory-utilization
      - ${AITAGGER_VLM_UTIL:-0.58}
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - ${AITAGGER_VLM_SEQS:-8}
      - --limit-mm-per-prompt
      - '{"image":8}'
      - --max-num-batched-tokens
      - "8192"
      - --mm-processor-kwargs
      - '{"max_pixels":589824}'
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
