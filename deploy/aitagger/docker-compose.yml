# AI Tagger (experimental): one GPU container the panel starts when it needs it.
#   tagger  WD EVA02-Large Tagger v3 + PixAI Tagger v1.0 + RAM++ image taggers (immich_organizer/tagger_service.py)
# It stops by itself / is stopped by the panel, freeing the GPU (restart is "no" on purpose).
#   build once:  docker compose -p immich-aitagger -f deploy/aitagger/docker-compose.yml build tagger
# The model files (about 1.4 GB WD + 1.9 GB PixAI + 3.0 GB RAM++ on first use) live in AITAGGER_CACHE
# (set it in deploy/aitagger/.env, see .env.example).
name: immich-aitagger
services:
  tagger:
    build: .
    image: immich-aitagger:latest
    container_name: immich_aitagger
    restart: "no"
    mem_limit: 12g
    memswap_limit: 12g
    ports:
      - "127.0.0.1:11440:8080"
    volumes:
      - ${AITAGGER_CACHE:-~/vlm/models/aitagger}:/cache
      - ../../immich_organizer:/app:ro
    environment:
      AITAGGER_VRAM_GB: ${AITAGGER_VRAM_GB:-5}      # memory cap for the tagger process (WD + PixAI + RAM++ together)
      AITAGGER_BATCH: ${AITAGGER_BATCH:-8}          # pictures per GPU micro-batch (speed does not depend on it; memory does)
      IDLE_EXIT_MINUTES: ${IDLE_EXIT_MINUTES:-20}   # the server exits after this long without a request (never mid-request)
      WD_MODEL: SmilingWolf/wd-eva02-large-tagger-v3
      PIXAI_MODEL: pixai-labs/pixai-tagger-v1.0     # the revision (commit) is pinned in tagger_service.py
      RAM_MODEL: xinyu1205/recognize-anything-plus-model   # ditto; RAM++'s source files are pinned in the Dockerfile
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      HF_HUB_DISABLE_TELEMETRY: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
